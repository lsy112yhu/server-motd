name: One-shot wallpaper API hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-wallpaper-api.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt jinja2

      - name: Apply v1.7.9 wallpaper API hotfix
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          main_path = Path('main.py')
          text = main_path.read_text(encoding='utf-8')
          text = replace_once(text, 'PLUGIN_VERSION = "1.7.8"', 'PLUGIN_VERSION = "1.7.9"', 'plugin version')
          text = replace_once(
              text,
              'WALLPAPER_API_BASE = "https://t.alcy.cc/json/"',
              'WALLPAPER_API_BASE = "https://t.alcy.cc/json"',
              'wallpaper API base',
          )

          old_results = '''                    results = await asyncio.gather(
                        *(self._fetch_random_wallpaper_bytes(session) for _ in range(batch_size)),
                        return_exceptions=True,
                    )
                    added = 0
                    for result in results:
                        if not isinstance(result, bytes):
                            continue
'''
          new_results = '''                    results = await asyncio.gather(
                        *(self._fetch_random_wallpaper_bytes(session) for _ in range(batch_size)),
                        return_exceptions=True,
                    )
                    failures = [item for item in results if isinstance(item, Exception)]
                    if failures:
                        first = failures[0]
                        logger.warning(
                            f"[MOTD] 壁纸下载失败: {type(first).__name__}: {first} "
                            f"(本批失败 {len(failures)}/{len(results)})"
                        )
                    added = 0
                    for result in results:
                        if not isinstance(result, bytes):
                            continue
'''
          text = replace_once(text, old_results, new_results, 'wallpaper error logging')
          main_path.write_text(text, encoding='utf-8')

          tests_path = Path('tests/test_motd.py')
          tests = tests_path.read_text(encoding='utf-8')
          marker = '''class WallpaperCommandTests(unittest.IsolatedAsyncioTestCase):
'''
          replacement = '''class WallpaperCommandTests(unittest.IsolatedAsyncioTestCase):
    def test_wallpaper_api_uses_current_json_endpoint(self):
        self.assertEqual(motd.WALLPAPER_API_BASE, 'https://t.alcy.cc/json')

'''
          tests = replace_once(tests, marker, replacement, 'wallpaper endpoint regression test')
          tests_path.write_text(tests, encoding='utf-8')

          metadata_path = Path('metadata.yaml')
          metadata = metadata_path.read_text(encoding='utf-8')
          metadata = replace_once(metadata, 'version: 1.7.8', 'version: 1.7.9', 'metadata version')
          metadata_path.write_text(metadata, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          changelog = '''## [v1.7.9] - 2026-10-18

- 修复栗次元在 2026 年更新 JSON 接口后，旧的 `/json/?分类` 路径导致壁纸预取持续失败的问题；改用官方当前文档的 `/json?分类` 格式。
- 壁纸批量预取失败时现在会记录首个具体异常与本批失败数量，便于排查网络、HTTP、JSON 或图片格式问题。
- 保留 v1.7.8 的 `/motd wallpaper status` 与 `/motd wallpaper refill` 主动缓存命令。

''' + changelog
          changelog_path.write_text(changelog, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace('> **1.7.8 地址访问规则**', '> **1.7.9 地址访问规则**', 1)
          readme = readme.replace('[MOTD] 插件已加载 v1.7.8', '[MOTD] 插件已加载 v1.7.9', 1)
          readme_path.write_text(readme, encoding='utf-8')

      - name: Syntax check
        run: python -m py_compile main.py tests/test_motd.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Commit hotfix and remove one-shot workflow
        run: |
          rm .github/workflows/hotfix-wallpaper-api.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py tests/test_motd.py metadata.yaml CHANGELOG.md README.md .github/workflows/hotfix-wallpaper-api.yml
          git commit -m "fix: update wallpaper JSON API endpoint"
          git push
